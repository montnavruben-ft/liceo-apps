<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elegir alumno</title>
<style>
:root{--ink:#1B1F3B;--paper:#F3F5F9;--card:#FFFFFF;--line:#C9D1E8;--muted:#4A5272;--blue:#2C5BE0;--amber:#FFC247;--onamber:#1B1F3B;--red:#C62F3A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#F3F5F9;--paper:#14172B;--card:#1D2142;--line:#3A4175;--muted:#B8C0E0;--blue:#8FA8FF;--red:#FF8A93}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.6;padding:20px 16px}
h1{font-size:22px;font-weight:500;margin:0 0 4px}
p{margin:0;color:var(--muted)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
label{font-weight:500}
textarea{width:100%;min-height:150px;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-size:16px;font-weight:500;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:44px}
button.primary{background:var(--blue);border-color:var(--blue);color:#FFFFFF}
button.amber{background:var(--amber);border-color:var(--amber);color:var(--onamber)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.err{color:var(--red);font-size:13px;min-height:1.2em}
.stage{text-align:center;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.name{font-size:40px;font-weight:500;line-height:1.2;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:14px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--muted)}
.chip.done{text-decoration:line-through;opacity:.55}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Elegir un alumno al azar</h1>
  <div class="card">
    <label for="names">Alumnos presentes (uno por línea)</label>
    <textarea id="names" placeholder="Ana&#10;Luis&#10;Sofía"></textarea>
    <div class="err" id="err"></div>
    <div class="row">
      <button class="primary" id="load">Usar esta lista</button>
      <button id="reset">Reiniciar ronda</button>
    </div>
  </div>
  <div class="card">
    <div class="stage" aria-live="polite">
      <div class="name" id="result">—</div>
      <div class="meta" id="meta">Carga la lista para empezar.</div>
    </div>
    <div class="row" style="justify-content:center">
      <button class="amber" id="pick" disabled>Elegir alumno</button>
    </div>
  </div>
  <div class="card" id="pickedCard" hidden>
    <p>Ya participaron en esta ronda</p>
    <div class="chips" id="picked"></div>
  </div>
</div>
<script>
(function(){
  var list = [], done = [], timer = null;
  var $ = function(id){ return document.getElementById(id); };
  var names = $('names'), err = $('err'), pick = $('pick'), result = $('result'), meta = $('meta');

  function parse(text){
    var seen = {}, out = [];
    text.split(/\n|,/).map(function(s){ return s.trim(); }).forEach(function(s){
      var k = s.toLowerCase();
      if (s && !seen[k]) { seen[k] = true; out.push(s); }
    });
    return out;
  }
  function remaining(){ return list.filter(function(n){ return done.indexOf(n) < 0; }); }
  function renderState(){
    var rem = remaining();
    pick.disabled = rem.length === 0 || !!timer;
    meta.textContent = list.length ? (rem.length + ' de ' + list.length + ' sin participar') : 'Carga la lista para empezar.';
    $('pickedCard').hidden = done.length === 0;
    var box = $('picked'); box.innerHTML = '';
    done.forEach(function(n){
      var s = document.createElement('span'); s.className = 'chip done'; s.textContent = n; box.appendChild(s);
    });
    if (list.length && rem.length === 0) meta.textContent = 'Todos participaron. Reinicia la ronda para volver a empezar.';
  }

  $('load').onclick = function(){
    var parsed = parse(names.value);
    if (!parsed.length) { err.textContent = 'Escribe al menos un nombre.'; return; }
    err.textContent = '';
    list = parsed; done = []; result.textContent = '—';
    renderState();
  };
  names.addEventListener('input', function(){ err.textContent = ''; });
  $('reset').onclick = function(){
    if (timer) { clearInterval(timer); timer = null; }
    done = []; result.textContent = '—'; renderState();
  };
  pick.onclick = function(){
    var rem = remaining();
    if (!rem.length || timer) return;
    var ticks = 0, total = 18;
    pick.disabled = true;
    timer = setInterval(function(){
      ticks++;
      result.textContent = rem[Math.floor(Math.random() * rem.length)];
      if (ticks >= total) {
        clearInterval(timer); timer = null;
        var winner = rem[Math.floor(Math.random() * rem.length)];
        result.textContent = winner;
        done.push(winner);
        renderState();
      }
    }, 90);
  };
  renderState();
})();
</script>
</body>
</html>
