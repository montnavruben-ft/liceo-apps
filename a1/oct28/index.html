<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Future with will · A1 Review</title>
<style>
:root{
  --ink:#1B1F3B; --paper:#F3F5F9; --card:#FFFFFF; --soft:#E1E7F5; --line:#C9D1E8;
  --amber:#FFC247; --blue:#2C5BE0; --muted:#4A5272; --green:#0E7A5F; --red:#C62F3A;
  --greenbg:#DDF3EC; --redbg:#FBE3E5; --onamber:#1B1F3B; --onblue:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#F3F5F9; --paper:#14172B; --card:#1D2142; --soft:#272D58; --line:#3A4175;
    --amber:#FFC247; --blue:#8FA8FF; --muted:#B8C0E0; --green:#5FD3B5; --red:#FF8A6B;
    --greenbg:#17433A; --redbg:#4D2733; --onamber:#1B1F3B; --onblue:#14172B;
  }
}
:root[data-theme="dark"]{--ink:#F3F5F9; --paper:#14172B; --card:#1D2142; --soft:#272D58; --line:#3A4175; --amber:#FFC247; --blue:#8FA8FF; --muted:#B8C0E0; --green:#5FD3B5; --red:#FF8A6B; --greenbg:#17433A; --redbg:#4D2733; --onamber:#1B1F3B; --onblue:#14172B;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:18px;line-height:1.45}
h1,h2,h3{font-family:Cambria,Georgia,"Times New Roman",serif;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1000px;margin:0 auto;padding:20px 20px 60px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
header.top h1{font-size:30px;flex:1;min-width:220px}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--soft);border-radius:999px;padding:8px 16px;font-weight:700;font-size:16px}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:12px;padding:12px 22px;font-weight:700}
.btn.amber{background:var(--amber);color:var(--onamber)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.tile:focus-visible,.cell:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hero{background:#1B1F3B;color:#F3F5F9;border-radius:22px;padding:28px 30px;margin-bottom:24px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.hero h2{font-size:34px;margin-bottom:6px}
.hero p{margin:0;color:#B8C0E0;max-width:560px}
.hero .big{margin-left:auto;text-align:center;background:var(--amber);color:#1B1F3B;border-radius:18px;padding:14px 26px}
.hero .big b{display:block;font-family:Cambria,Georgia,serif;font-size:40px;line-height:1}
.hero .big span{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:128px}
.tile:hover{border-color:var(--blue)}
.tile .n{width:34px;height:34px;border-radius:50%;background:var(--amber);color:var(--onamber);font-weight:800;display:grid;place-items:center;font-size:15px}
.tile h3{font-size:21px}
.tile p{margin:0;color:var(--muted);font-size:15px}
.tile .sc{margin-top:auto;font-weight:700;font-size:14px;color:var(--muted)}
.tile.done{border-color:var(--green)}
.tile.done .sc{color:var(--green)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:26px}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}
.q{font-family:Cambria,Georgia,serif;font-size:30px;font-weight:700;line-height:1.25;margin:6px 0 20px}
.tag{display:inline-block;background:var(--soft);color:var(--muted);border-radius:8px;padding:3px 10px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.opts{display:grid;gap:12px}
.opt{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:14px 18px;text-align:left;font-size:21px;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.ok{background:var(--greenbg);border-color:var(--green)}
.opt.bad{background:var(--redbg);border-color:var(--red)}
.opt:disabled{cursor:default}
.fb{margin-top:18px;border-radius:14px;padding:14px 18px;font-size:18px}
.fb.ok{background:var(--greenbg);border-left:6px solid var(--green)}
.fb.bad{background:var(--redbg);border-left:6px solid var(--red)}
.fb b{display:block;margin-bottom:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:18px}
input.txt{font:inherit;font-size:24px;font-weight:700;border:0;border-bottom:3px solid var(--blue);background:var(--soft);color:var(--ink);padding:4px 10px;border-radius:8px 8px 0 0;width:210px;text-align:center}
input.txt.wide{width:100%;text-align:left;font-size:22px;border-radius:10px;border:2px solid var(--line);padding:12px 14px}
input.txt.ok{background:var(--greenbg);border-color:var(--green)}
input.txt.bad{background:var(--redbg);border-color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:10px;min-height:56px}
.chip{background:var(--blue);color:var(--onblue);border:0;border-radius:12px;padding:10px 16px;font-size:21px;font-weight:700}
.chip.used{opacity:.25}
.drop{border:2px dashed var(--line);border-radius:14px;padding:10px;min-height:68px;margin-bottom:14px;background:var(--paper)}
.drop .chip{background:var(--ink);color:var(--paper)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px}
.match .col{display:grid;gap:10px;align-content:start}
.m{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;font-size:18px;font-weight:600}
.m.sel{border-color:var(--blue);background:var(--soft)}
.m.done{background:var(--greenbg);border-color:var(--green);cursor:default}
.m.shake{animation:sh .35s;border-color:var(--red)}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cards{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap}
.cards .opt{flex:1;min-width:150px;text-align:center}
.bigword{font-family:Cambria,Georgia,serif;font-size:46px;font-weight:700;text-align:center;background:var(--soft);border-radius:18px;padding:30px 10px;margin:8px 0 18px}
.ladder{width:100%;border-collapse:separate;border-spacing:0 8px}
.ladder th{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 8px}
.ladder td{padding:0 6px 0 0}
.ladder .given{background:var(--ink);color:var(--paper);font-weight:700;border-radius:10px;padding:10px 14px;font-size:20px}
.ladder input{width:100%;font:inherit;font-size:20px;font-weight:700;padding:9px 12px;border-radius:10px;border:2px dashed var(--muted);background:var(--soft);color:var(--ink)}
.ladder input.ok{border:2px solid var(--green);background:var(--greenbg)}
.ladder input.bad{border:2px solid var(--red);background:var(--redbg)}
.cwwrap{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:start}
@media (max-width:860px){.cwwrap{grid-template-columns:1fr}.match{grid-template-columns:1fr}}
.cw{display:grid;gap:2px;width:max-content;max-width:100%}
.cell{position:relative;width:var(--cs,38px);height:var(--cs,38px)}
.cwscroll{overflow-x:auto;max-width:100%;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.cwtip{display:none}
@media (max-width:860px){.cwtip{display:block}}
.cell.blk{background:transparent}
.cell input{width:100%;height:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);text-align:center;font:inherit;font-weight:800;font-size:max(16px,calc(var(--cs,38px)*.52));text-transform:uppercase;padding:0;border-radius:6px;caret-color:transparent}
.cell input.in{background:var(--soft)}
.cell input.cur{background:var(--amber);color:var(--onamber);border-color:var(--amber)}
.cell input.ok{background:var(--greenbg);border-color:var(--green)}
.cell input.bad{background:var(--redbg);border-color:var(--red)}
.cell small{position:absolute;top:1px;left:3px;font-size:10px;font-weight:700;color:var(--muted);pointer-events:none;z-index:1}
.clues h3{font-size:19px;margin:0 0 6px}
.clues ol{margin:0 0 14px;padding:0;list-style:none}
.clues li{padding:6px 10px;border-radius:8px;font-size:16px;cursor:pointer}
.clues li b{display:inline-block;min-width:34px}
.clues li:hover{background:var(--soft)}
.clues li.act{background:var(--amber);color:var(--onamber)}
.clues li.fin{text-decoration:line-through;opacity:.55}
.sum{text-align:center;padding:10px 0}
.sum .score{font-family:Cambria,Georgia,serif;font-size:72px;font-weight:700;line-height:1}
.sum p{color:var(--muted)}
.rules summary{cursor:pointer;font-weight:700;padding:10px 0}
.rules table{border-collapse:collapse;width:100%;font-size:16px;margin:6px 0 14px}
.rules td,.rules th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.rules th{color:var(--muted);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.k{font-weight:800;color:var(--blue)}
.hint{color:var(--muted);font-size:16px}
[hidden]{display:none!important}
.pill:empty{display:none}
.pill.paused{background:var(--redbg);color:var(--red)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.12em}
input.txt.mono{text-transform:uppercase}
.idbig{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:64px;font-weight:800;letter-spacing:.2em;background:var(--amber);color:#1B1F3B;border-radius:18px;padding:18px 10px 18px 28px;margin:14px 0}
.hint.err{color:var(--red);min-height:1.4em;margin:6px 0}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px;font-weight:700}
.tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tile.prog{border-color:var(--amber)}
.tile.prog .sc{color:var(--blue)}
.ov{position:fixed;inset:0;background:rgba(10,12,30,.6);display:grid;place-items:center;z-index:50;padding:20px}
.dlg{background:var(--card);color:var(--ink);border-radius:18px;padding:26px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.dlg p{margin:0 0 6px;font-size:19px}
.opt.sel{border-color:var(--blue);background:var(--soft)}
.fb.neu{background:var(--soft);border-left:6px solid var(--blue)}
.passage{background:var(--soft);border-radius:14px;padding:14px 18px;margin:14px 0 18px;font-size:18px}
.passage b{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.passage p{margin:0}
textarea.area{width:100%;font:inherit;font-size:20px;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);padding:12px 14px;resize:vertical}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Future with will · A1 Review</h1>
    <span class="pill" id="timerPill" hidden></span>
    <span class="pill" id="idPill" hidden></span>
    <span class="pill" id="totalPill" hidden></span>
    <span class="pill" id="syncPill" hidden aria-live="polite"></span>
    <button class="btn ghost" id="homeBtn" hidden>All activities</button>
    <button class="btn ghost" id="themeBtn" aria-label="Toggle light and dark">Light / Dark</button>
  </header>
  <main id="app"></main>
</div>

<script>
/* ============ helpers ============ */
const $ = (s, r=document) => r.querySelector(s);
const el = (t, props={}, ...kids) => { const e=document.createElement(t); for(const k in props){ if(k==='class') e.className=props[k]; else if(k==='html') e.innerHTML=props[k]; else if(k.startsWith('on')) e.addEventListener(k.slice(2),props[k]); else e.setAttribute(k,props[k]); } kids.flat().forEach(c=>e.append(c&&c.nodeType?c:document.createTextNode(c??''))); return e; };
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const norm = s => String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/\s+/g,' ').trim().replace(/[.?!]+$/,'').trim();
const normC = s => norm(s).replace(/[,;]/g,'').replace(/\s+/g,' ').trim();
const app = $('#app');
/* ============ configuration ============ */
// 1) Paste the web-app URL of the teacher's Google Apps Script between the quotes.
//    Leave empty to run in offline mode (results are only kept on this device).
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxd5HASD9Y3_5OLQv8o3YrBOYT5Cxh2rl8EIDxhqaLy-mNS6zNVqcjDJaq8CE7cOMRbiw/exec";
// Quiz identifier. It tells the shared Apps Script which sheet to use. Do not change it.
const QUIZ_ID = "will";
// false = students do NOT see right/wrong or scores (recommended for a diagnostic). true = feedback after each answer.
const REVEAL = true;
const SHOW_SCORES = true;
// 2) Optional time limit in minutes (0 = no limit). When time is up, the quiz is sent automatically.
const TIME_LIMIT_MIN = 0;

const ACT = [];      // registered activities (in column order)
const store = (()=>{ try{ localStorage.setItem('_t','1'); localStorage.removeItem('_t'); return localStorage; }catch(e){ const m={}; return {getItem:k=>(k in m?m[k]:null),setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}}; } })();
const blankSt=()=>({id:'',name:'',done:{},prog:{},texts:{},t:0,sent:false,u:0});
let st=null;         // current student's state
let cur=null;        // current activity {id,data,finished,save()}
let dirty=false, saving=false, netFail=false, sendError='', timedOut=false;
const lsKey=id=>'q:'+QUIZ_ID+':'+id;
const normId=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function saveSt(touch=true){ if(!st||!st.id) return; if(touch) st.u=Date.now(); try{ store.setItem(lsKey(st.id),JSON.stringify(st)); }catch(e){} if(touch) dirty=true; }
function readLocal(id){ try{ const j=store.getItem(lsKey(id)); return j?JSON.parse(j):null; }catch(e){ return null; } }
function fixSt(s){ s.texts=s.texts||{}; s.done=s.done||{}; s.prog=s.prog||{}; s.t=s.t||0; s.u=s.u||0; s.sent=!!s.sent; return s; }
function mergeStates(a,b){
  if(!a) return b?fixSt(b):null; if(!b) return fixSt(a);
  a=fixSt(a); b=fixSt(b);
  const base=a.u>=b.u?a:b, other=base===a?b:a;
  base.t=Math.max(a.t,b.t); base.sent=a.sent||b.sent; base.texts=Object.assign({},other.texts||{},base.texts||{});
  for(const id in other.done) if(!base.done[id]) base.done[id]=other.done[id];
  for(const id in base.done) delete base.prog[id];
  return base;
}
const fmt=s=>{ s=Math.max(0,Math.floor(s)); const m=Math.floor(s/60), r=s%60; return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0'); };

/* ---------- grades ---------- */
const gradeOf=(got,total)=>Math.round(got/total*100)/10;
function average(){ let s=0; ACT.forEach(a=>{ if(st.done[a.id]) s+=st.done[a.id].grade; }); return Math.round(s/ACT.length*10)/10; }
function finalize(id,got,total,tp){
  if(st.done[id]) return st.done[id];
  got=Math.max(0,Math.min(total,got));
  const grade=gradeOf(got,total);
  st.done[id]={grade,got,total}; if(tp) st.done[id].tp=tp; delete st.prog[id];
  saveSt(); updateHeader();
  return st.done[id];
}
function finalizeAll(){ ACT.forEach(a=>{ if(!st.done[a.id]&&st.prog[a.id]) finalize(a.id,st.prog[a.id].got||0,a.total,st.prog[a.id].data&&st.prog[a.id].data.tp); }); }

/* ---------- server sync ---------- */
async function api(payload,keepalive=false){
  const r=await fetch(SCRIPT_URL,{method:'POST',keepalive,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({quiz:QUIZ_ID},payload))});
  const txt=await r.text();
  try{ return JSON.parse(txt); }catch(e){ const err=new Error('NOT_JSON'); err.detail='HTTP '+r.status+' · '+txt.replace(/\s+/g,' ').slice(0,80); throw err; }
}
function netMsg(e){
  if(e&&e.message==='NOT_JSON') return 'The server answered, but not with data ('+e.detail+'). Tell your teacher: the Apps Script deployment must allow access to "Anyone" and the URL must end in /exec.';
  return 'Could not connect to the server. Check your internet. If it keeps failing, tell your teacher ('+((e&&e.message)||'network error')+').';
}
async function checkServer(el2){
  if(!SCRIPT_URL){ el2.textContent='Offline mode: results are only kept on this device.'; return; }
  el2.textContent='Checking connection…';
  try{
    const r=await fetch(SCRIPT_URL); const txt=await r.text(); let j=null; try{ j=JSON.parse(txt); }catch(e){}
    if(j&&j.ok){ el2.textContent='Server connected ✓'; el2.style.color='var(--green)'; }
    else { el2.textContent='Server problem: it answered but not with data (HTTP '+r.status+'). Check the deployment: access must be "Anyone" and the URL must end in /exec.'; el2.style.color='var(--red)'; }
  }catch(e){ el2.textContent='Cannot reach the server ('+((e&&e.message)||'network error')+'). Check your internet or the script URL.'; el2.style.color='var(--red)'; }
}
function mergeServerDone(j){
  for(const id in (j.done||{})){ st.done[id]=Object.assign(st.done[id]||{},{grade:j.done[id]}); delete st.prog[id]; }
  if(j.sent||j.alreadySent) st.sent=true;
}
async function pushState(final=false,keepalive=false){
  if(!SCRIPT_URL||!st||!st.id||saving) return false;
  saving=true;
  try{
    const grades={}; ACT.forEach(a=>{ const d=st.done[a.id]; if(d&&d.got!==undefined) grades[a.id]={grade:d.grade,got:d.got,total:d.total,tp:d.tp}; });
    const j=await api({action:'save',id:st.id,final,grades,texts:st.texts,time:st.t,state:{done:st.done,prog:st.prog,texts:st.texts,t:st.t,u:st.u,sent:st.sent||final}},keepalive&&JSON.stringify(st).length<30000);
    saving=false;
    if(j&&j.ok){ netFail=false; mergeServerDone(j); dirty=false; if(final) st.sent=true; saveSt(false); updateHeader(); return true; }
    sendError=(j&&j.error)||'The server did not accept the data.'; updateHeader(); return false;
  }catch(e){ saving=false; netFail=true; dirty=true; sendError=netMsg(e); updateHeader(); return false; }
}
setInterval(()=>{ if(st&&st.id&&SCRIPT_URL&&!st.sent&&(dirty||netFail)&&!document.hidden) pushState(false); },8000);
window.addEventListener('online',()=>{ if(st&&SCRIPT_URL&&!st.sent) pushState(false); updateHeader(); });
window.addEventListener('offline',updateHeader);

/* ---------- timer: runs only while the page is visible and online ---------- */
function running(){ return !!st&&!!st.id&&!st.sent&&document.visibilityState==='visible'&&navigator.onLine!==false&&!(SCRIPT_URL&&netFail); }
setInterval(()=>{
  if(!st||!st.id) return;
  if(running()){
    st.t++;
    if(st.t%5===0) saveSt(false);
    if(st.t%30===0) dirty=true;
    if(TIME_LIMIT_MIN>0&&st.t>=TIME_LIMIT_MIN*60&&!timedOut) timeUp();
  }
  updateHeader();
},1000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'){ saveSt(false); if(SCRIPT_URL&&st&&st.id&&!st.sent) pushState(false,true); } updateHeader(); });
window.addEventListener('pagehide',()=>{ saveSt(false); if(SCRIPT_URL&&st&&st.id&&!st.sent) pushState(false,true); });
async function timeUp(){
  timedOut=true; cur=null; finalizeAll();
  app.innerHTML='';
  app.append(el('section',{class:'panel',style:'max-width:640px;margin:30px auto;text-align:center'},el('h2',{},'Time is up!'),el('p',{},'Your answers are being sent to your teacher…')));
  if(SCRIPT_URL){ await pushState(true); }
  showHome();
}

/* ---------- header ---------- */
function updateHeader(){
  const tp=$('#timerPill'), ap=$('#totalPill'), ip=$('#idPill'), sp=$('#syncPill');
  if(!st||!st.id){ [tp,ap,ip,sp].forEach(x=>x.hidden=true); return; }
  [tp,ap,ip,sp].forEach(x=>x.hidden=false);
  if(SHOW_SCORES) ap.textContent='Average '+average().toFixed(1)+' / 10'; else ap.hidden=true;
  ip.textContent='ID '+st.id;
  const left=TIME_LIMIT_MIN>0?TIME_LIMIT_MIN*60-st.t:null;
  const paused=!st.sent&&!running();
  tp.textContent=(paused?'⏸ ':'⏱ ')+(left!==null?'Left '+fmt(left):fmt(st.t))+(paused?' paused':'');
  tp.classList.toggle('paused',paused);
  if(!SCRIPT_URL) sp.textContent='Offline mode';
  else if(st.sent) sp.textContent='Sent ✓';
  else if(netFail||navigator.onLine===false) sp.textContent='No connection';
  else if(saving) sp.textContent='Saving…';
  else sp.textContent=dirty?'Saving soon…':'Saved ✓';
}
const updateTotal=updateHeader;

/* ---------- screens ---------- */
function confirmBox(msg,yes,onYes){
  const ov=el('div',{class:'ov'},el('div',{class:'dlg',role:'dialog'},el('p',{},msg),
    el('div',{class:'row'},el('button',{class:'btn amber',onclick:()=>{ov.remove();onYes();}},yes),el('button',{class:'btn ghost',onclick:()=>ov.remove()},'Keep working'))));
  document.body.append(ov);
}

function sequence(panel,id,title,items,renderer){
  const saved=cur.data;
  const order=saved?saved.order:shuffle(items.map((_,k)=>k));
  let i=saved?saved.i:0, score=saved?saved.score:0;
  const tp=saved&&saved.tp?saved.tp:{};
  if(!saved) items.forEach(it=>{ if(it.tp){ tp[it.tp]=tp[it.tp]||[0,0]; tp[it.tp][1]++; } });
  const persist=(next)=>cur.save({order,i:next,score,tp},score);
  if(!saved) persist(0);
  const step=()=>{
    if(i>=order.length) return summary(panel,id,score,order.length,tp);
    panel.innerHTML='';
    panel.append(el('div',{class:'bar'}, el('i',{style:'width:'+(100*i/order.length)+'%'})));
    panel.append(el('span',{class:'tag'}, title+' · '+(i+1)+' of '+order.length));
    const box=el('div'); panel.append(box);
    let answered=false;
    renderer(items[order[i]], box, (ok,expl,correctText)=>{
      if(answered) return; answered=true; if(ok){ score++; const tg=items[order[i]].tp; if(tg&&tp[tg]) tp[tg][0]++; } persist(i+1);
      box.append(REVEAL?el('div',{class:'fb '+(ok?'ok':'bad')}, el('b',{}, ok?'Correct!':'Not quite.'), (!ok&&correctText?('Answer: '+correctText+'. '):'')+(expl||'')):el('div',{class:'fb neu'},el('b',{},'Answer saved.'),'Go to the next question.'));
      const last = i===order.length-1;
      const nb = el('button',{class:'btn amber',onclick:()=>{i++;step();}}, last?'See results':'Next');
      box.append(el('div',{class:'row'}, nb)); nb.focus();
    });
  };
  step();
}

    });
    rorder.forEach(i=>{
      const b=el('button',{class:'m'+(found.includes(i)?' done':''),'data-i':i},pairs[i][1]);
      b.onclick=()=>{
        if(b.classList.contains('done')||!left) return;
        if(left.dataset.i===b.dataset.i){ left.classList.remove('sel'); left.classList.add('done'); b.classList.add('done'); found.push(+b.dataset.i); left=null; persist();
          if(found.length===pairs.length) setTimeout(()=>summary(panel,id,got(),pairs.length),500);
        } else { mistakes++; persist(); b.classList.add('shake'); setTimeout(()=>b.classList.remove('shake'),400); mis.textContent='Mistakes: '+mistakes; }
      }; R.append(b);
    });
    panel.append(el('div',{class:'match'},L,R), el('div',{class:'row'},mis));
    if(found.length===pairs.length) setTimeout(()=>summary(panel,id,got(),pairs.length),0);
  };
}

reg('cw','Crossword','Words for the future with will.',CW.entries.length, panel=>{
  const H=CW.h,W=CW.w, ents=CW.entries;
  const nums={}; let n=0;
  const starts=ents.map(e=>[e.r,e.c]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  starts.forEach(([r,c])=>{ const k=r+','+c; if(!nums[k]) nums[k]=++n; });
  ents.forEach(e=>{ e.n=nums[e.r+','+e.c]; e.cells=[...e.w].map((_,i)=>e.d==='A'?[e.r,e.c+i]:[e.r+i,e.c]); });
  const map={}; ents.forEach(e=>e.cells.forEach(([r,c],i)=>{ const k=r+','+c; (map[k]=map[k]||{ch:e.w[i],e:[]}).e.push(e); }));
  let active=null, dir='A', submitted=false;
  panel.innerHTML='';
  panel.append(el('span',{class:'tag'},'Crossword'));
  panel.append(el('p',{class:'hint cwtip'},'Tip: swipe the crossword sideways to see all the squares.'));
  panel.append(el('p',{class:'hint'},'Click a square or a clue and type. Click the same square again to switch between across and down. Your letters are saved if you leave. You can submit only once.'));
  const grid=el('div',{class:'cw',style:`--cs:clamp(26px,calc((100vw - 110px)/${W}),38px);grid-template-columns:repeat(${W},var(--cs))`});
  const inputs={};
  const wordOk=e=>e.cells.every(([r,c],i)=>inputs[r+','+c].value.toUpperCase()===e.w[i]);
  const countOk=()=>ents.filter(wordOk).length;
  const persist=()=>{ const v={}; Object.keys(inputs).forEach(k=>{ if(inputs[k].value) v[k]=inputs[k].value.toUpperCase(); }); cur.save({v},countOk()); };
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){
    const k=r+','+c;
    if(!map[k]){ grid.append(el('div',{class:'cell blk'})); continue; }
    const inp=el('input',{maxlength:'1',autocomplete:'off',autocapitalize:'characters',spellcheck:'false','aria-label':'Row '+(r+1)+', column '+(c+1)});
    if(cur.data&&cur.data.v&&cur.data.v[k]) inp.value=cur.data.v[k];
    const cell=el('div',{class:'cell'}, nums[k]?el('small',{},nums[k]):'', inp);
    inputs[k]=inp; grid.append(cell);
    inp.addEventListener('focus',()=>{ select(k,false); });
    inp.addEventListener('mousedown',()=>{ if(document.activeElement===inp) select(k,true); });
    inp.addEventListener('keydown',ev=>{
      if(submitted) return;
      const [rr,cc]=k.split(',').map(Number);
      if(ev.key==='ArrowRight'){goto(rr,cc+1,'A');ev.preventDefault();}
      else if(ev.key==='ArrowLeft'){goto(rr,cc-1,'A');ev.preventDefault();}
      else if(ev.key==='ArrowDown'){goto(rr+1,cc,'D');ev.preventDefault();}
      else if(ev.key==='ArrowUp'){goto(rr-1,cc,'D');ev.preventDefault();}
      else if(ev.key==='Backspace'){ ev.preventDefault(); if(inp.value){inp.value='';} else step(-1); persist(); }
      else if(/^[a-zA-Z]$/.test(ev.key)){ ev.preventDefault(); inp.value=ev.key.toUpperCase(); step(1); persist(); }
    });
  }
  if(!cur.data) cur.save({v:{}},0);
  function goto(r,c,d){ const k=r+','+c; if(inputs[k]){ dir=d; inputs[k].focus(); } }
  function step(delta){
    if(!active) return;
    const idx=active.cells.findIndex(([r,c])=>inputs[r+','+c]===document.activeElement);
    const nx=active.cells[idx+delta]; if(nx) inputs[nx[0]+','+nx[1]].focus();
  }
  function select(k,toggle){
    const es=map[k].e;
    if(toggle && es.length>1) dir = dir==='A'?'D':'A';
    const e=es.find(x=>x.d===dir) || es[0]; dir=e.d; active=e;
    paint();
  }
  function paint(){
    if(submitted) return;
    Object.values(inputs).forEach(i=>i.classList.remove('in','cur'));
    if(active) active.cells.forEach(([r,c])=>inputs[r+','+c].classList.add('in'));
    const f=document.activeElement; if(f&&f.tagName==='INPUT'&&f.closest('.cw')) f.classList.add('cur');
    document.querySelectorAll('.clues li').forEach(li=>li.classList.toggle('act',!!active&&li.dataset.id===active.w));
  }
  const clueList=(d,label)=>{
    const ol=el('ol');
    ents.filter(e=>e.d===d).sort((a,b)=>a.n-b.n).forEach(e=>{
      ol.append(el('li',{'data-id':e.w,onclick:()=>{ if(submitted) return; active=e; dir=e.d; const [r,c]=e.cells.find(([r,c])=>!inputs[r+','+c].value)||e.cells[0]; inputs[r+','+c].focus(); paint(); }}, el('b',{},e.n+'.'), e.clue+' ('+e.w.length+')'));
    });
    return el('div',{}, el('h3',{},label), ol);
  };
  const submit=()=>{
    const blanks=Object.keys(inputs).filter(k=>!inputs[k].value).length;
    confirmBox((blanks?('You still have '+blanks+' empty squares. '):'')+'Submit your crossword now? You cannot change it afterwards.','Yes, submit',()=>{
      submitted=true; cur.finished=true;
      Object.keys(inputs).forEach(k=>{ const i=inputs[k]; i.disabled=true; i.classList.remove('in','cur'); i.classList.add(i.value.toUpperCase()===map[k].ch?'ok':'bad'); });
      const ok=countOk(); const d=finalize('cw',ok,ents.length);
      document.querySelectorAll('.clues li').forEach(li=>{ li.classList.remove('act'); const e=ents.find(x=>x.w===li.dataset.id); li.classList.toggle('fin',wordOk(e)); });
      sb.remove();
      msg.append(el('div',{class:'fb '+(ok===ents.length?'ok':'bad')}, el('b',{},'Grade: '+d.grade.toFixed(1)+' / 10'), ok+' of '+ents.length+' words correct. This activity is now closed.'),
        el('div',{class:'row'}, el('button',{class:'btn amber',onclick:showHome},'Back to activities')));
      msg.scrollIntoView({behavior:'smooth'});
    });
  };
  const msg=el('div');
  const sb=el('button',{class:'btn amber',onclick:submit},'Submit crossword');
  panel.append(el('div',{class:'cwwrap'},el('div',{class:'cwscroll'},grid),el('div',{class:'clues'},clueList('A','Across'),clueList('D','Down'))));
  panel.append(el('div',{class:'row'},sb), msg);
});
