<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Physioverse · Fernando</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b1120; font-family: 'Inter', sans-serif; }
  #video { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b1120; }
  .abs { position: absolute; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); }
  .scene { position: absolute; inset: 0; }
  /* Clips de plastilina */
  .clip { position: absolute; left: 0; width: 1080px; overflow: hidden; }
  .clip img { position: absolute; left: 0; top: 0; width: 1080px; transform-origin: 50% 45%; }
  .clip::after { content: ''; position: absolute; inset: 0;
    background: linear-gradient(#0b1120, rgba(11,17,32,0) 12%, rgba(11,17,32,0) 86%, #0b1120); }
  /* Captions */
  .cap { position: absolute; left: 60px; right: 60px; top: 150px; text-align: center; }
  .cap h1 { color: #fff; font-size: 66px; font-weight: 900; letter-spacing: -1.2px; line-height: 1.08; }
  .cap h1 span { display: inline-block; }
  .cap p { margin-top: 20px; color: #5eead4; font-size: 36px; font-weight: 600; }
  /* Globo de pensamiento */
  #bubble { position: absolute; left: 470px; top: 520px; width: 520px; padding: 30px 36px; border-radius: 60px; background: #fff;
            color: #1e293b; font-size: 36px; font-weight: 700; line-height: 1.2; box-shadow: 0 20px 50px rgba(0,0,0,.4); }
  #bubble i { position: absolute; border-radius: 50%; background: #fff; }
  /* Ventanas de PC */
  .win { position: absolute; width: 640px; border-radius: 26px; background: #f8fafc; box-shadow: 0 30px 70px rgba(0,0,0,.55);
         overflow: hidden; font-size: 30px; color: #0f172a; }
  .win .bar { height: 54px; background: #e2e8f0; display: flex; align-items: center; gap: 12px; padding-left: 22px; }
  .win .bar b { width: 18px; height: 18px; border-radius: 50%; display: block; }
  .win .body { padding: 28px 32px 34px; }
  .err .body { display: flex; gap: 24px; align-items: center; font-weight: 700; }
  .err .ic { flex: none; width: 70px; height: 70px; border-radius: 50%; background: #fee2e2; color: #dc2626; font-size: 46px; font-weight: 900;
             display: flex; align-items: center; justify-content: center; }
  .err small { display: block; font-weight: 500; color: #64748b; font-size: 25px; margin-top: 6px; }
  /* Teléfono */
  #phoneWrap { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #bezel { position: absolute; left: -38px; top: -38px; width: 1264px; height: 2652px; border-radius: 178px;
           background: linear-gradient(145deg, #2a3142, #05070d 40%, #1a2030); box-shadow: 0 60px 160px rgba(0,0,0,.65), inset 0 0 0 4px rgba(255,255,255,.08); }
  #screen { position: absolute; left: 0; top: 0; width: 1188px; height: 2576px; border-radius: 142px; overflow: hidden; background: #eff2f7; }
  #screen > img { position: absolute; left: 0; top: 0; width: 1188px; height: 2576px; }
  #finger { position: absolute; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%;
            background: rgba(255,255,255,.55); border: 5px solid rgba(255,255,255,.95); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  #ripple { position: absolute; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%; border: 6px solid #fff; }
  #captionShade { position: absolute; left: 0; top: 0; width: 1080px; height: 520px; background: linear-gradient(#0b1120 62%, rgba(11,17,32,0)); }
</style>
</head>
<body>
<div id="video"></div>
<script>
const V = document.getElementById('video');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, t0, t1) => clamp((t - t0) / (t1 - t0));
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eout = k => 1 - Math.pow(1 - k, 3);
const eback = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const el = (html) => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; };
const add = (parent, html) => parent.appendChild(el(html));
const typed = (s, t, t0, cps) => s.slice(0, Math.floor(clamp((t - t0) * cps, 0, s.length)));
const vis = (t, a, b, fi = .35, fo = .35) => prog(t, a, a + fi) * (1 - prog(t, b - fo, b));

/* ---------- Fondo ---------- */
add(V, '<div class="blob" id="b1" style="width:760px;height:760px;background:rgba(45,212,191,.22)"></div>');
add(V, '<div class="blob" id="b2" style="width:820px;height:820px;background:rgba(139,92,246,.26)"></div>');
function drawBg(t) {
  document.getElementById('b1').style.transform = `translate(${-260 + 90 * Math.sin(t * .6)}px,${120 + 70 * Math.cos(t * .5)}px)`;
  document.getElementById('b2').style.transform = `translate(${520 + 80 * Math.cos(t * .45)}px,${1150 + 90 * Math.sin(t * .55)}px)`;
}

/* ---------- Clips de plastilina (stop-motion) ---------- */
function makeClip(id, n, h, top, holds, t0) {
  const sc = add(V, `<div class="scene" id="${id}"></div>`);
  const box = add(sc, `<div class="clip" style="top:${top}px;height:${h}px"></div>`);
  const imgs = Array.from({ length: n }, (_, i) => add(box, `<img src="assets/fernando/${id}_${i}.jpg" style="opacity:0">`));
  const starts = []; let acc = t0; holds.forEach(d => { starts.push(acc); acc += d; });
  return { sc, box, imgs, starts, t0, t1: acc };
}
function drawClip(c, t, zoom = .06) {
  let idx = 0; c.starts.forEach((s, i) => { if (t >= s) idx = i; });
  c.imgs.forEach((im, i) => im.style.opacity = i === idx ? 1 : 0);
  const k = prog(t, c.t0, c.t1);
  const s = 1 + zoom * k;
  c.imgs[idx].style.transform = `scale(${s})`;
}

const C1 = makeClip('c1', 9, 1328, 520, [.7, .7, .8, 1.0, .9, .9, .8, .9, 1.9], 0);           // 0 → 8.6
const C2 = makeClip('c2', 8, 1349, 520, [.8, .8, .8, .9, .9, 1.0, .9, 1.5], 8.6);             // 8.6 → 16.2
const C3 = makeClip('c3', 9, 959, 620, [.5, .45, .4, .4, .45, .45, .45, .5, 1.2], 28.6);      // 28.6 → 33.4

/* Globo de pensamiento (escena 1) */
const bubble = add(C1.sc, `<div id="bubble">¿Dónde quedó la valoración de la Sra. López?
  <i style="left:70px;bottom:-34px;width:40px;height:40px"></i><i style="left:40px;bottom:-66px;width:24px;height:24px"></i></div>`);

/* Ventanas de PC (escena 2) */
const prog1 = add(C2.sc, `<div class="win" style="left:400px;top:1190px">
  <div class="bar"><b style="background:#f87171"></b><b style="background:#fbbf24"></b><b style="background:#34d399"></b></div>
  <div class="body"><div style="font-weight:700">Importando expedientes…</div>
  <div style="margin-top:20px;height:22px;border-radius:11px;background:#e2e8f0;overflow:hidden"><div id="pbar" style="height:100%;width:0;background:#3b82f6"></div></div>
  <div style="margin-top:14px;color:#64748b;font-size:26px" id="ptext">0 %</div></div></div>`);
const ERRS = [
  ['Formato no compatible', 'expediente_2014_escaneado.jpg', 300, 1000, 10.9],
  ['No se pudo leer el texto', 'valoracion_lopez_manuscrita.pdf', 170, 1320, 11.9],
  ['0 de 437 expedientes migrados', 'Revisa tus archivos e inténtalo de nuevo', 240, 1620, 12.9]
].map(([a, b, x, y, t]) => ({ t, n: add(C2.sc, `<div class="win err" style="left:${x}px;top:${y}px">
  <div class="bar"><b style="background:#f87171"></b><b style="background:#fbbf24"></b><b style="background:#34d399"></b></div>
  <div class="body"><div class="ic">!</div><div>${a}<small>${b}</small></div></div></div>`) }));

/* ---------- Transición galaxia (escena 3) ---------- */
const S3 = add(V, `<div class="scene">
  <div class="abs" id="gx" style="left:140px;top:560px;width:800px;height:800px;border-radius:50%;overflow:hidden;box-shadow:0 0 160px 40px rgba(139,92,246,.6);-webkit-mask-image:radial-gradient(circle,#000 97%,transparent 100%)">
    <img src="assets/logo_master.jpg" style="position:absolute;left:-110.4px;top:-106.4px;width:1023.9px;height:1023.9px"></div>
  <div class="abs" id="flash" style="inset:0;background:radial-gradient(circle at 540px 960px,#fff,rgba(165,243,252,.6) 40%,rgba(139,92,246,0) 75%)"></div></div>`);

/* ---------- Teléfono (escena 4) ---------- */
const S4 = add(V, '<div class="scene"></div>');
const S = 0.585, CX = 540, CY = 1130;
const pw = add(S4, '<div id="phoneWrap"><div id="bezel"></div><div id="screen"></div></div>');
const scr = pw.querySelector('#screen');
const imNuevo = add(scr, '<img src="assets/fernando/nuevo.jpg">');
const rowHi = add(scr, '<div class="abs" style="left:160px;top:1170px;width:680px;height:116px;border-radius:24px;background:rgba(59,130,246,.14);border:3px solid rgba(59,130,246,.5)"></div>');
const imImp = add(scr, '<img src="assets/fernando/importar.jpg">');
// zona de carga con archivo
const zone = add(scr, `<div class="abs" style="left:212px;top:648px;width:765px;height:381px;border-radius:52px;background:#f0fdfa;border:4px dashed #14b8a6;display:flex;align-items:center;justify-content:center"></div>`);
const fileCard = add(scr, `<div class="abs" style="left:290px;top:735px;width:610px;height:210px;border-radius:34px;background:#fff;box-shadow:0 20px 50px rgba(15,23,42,.18);display:flex;align-items:center;gap:30px;padding:0 34px">
  <div style="flex:none;width:118px;height:146px;border-radius:16px;background:#fee2e2;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:16px">
    <span style="font-size:30px;font-weight:900;color:#fff;background:#dc2626;border-radius:8px;padding:4px 12px">PDF</span></div>
  <div><div style="font-size:38px;font-weight:800;color:#0f172a">Expedientes_2014.pdf</div><div style="font-size:30px;color:#64748b;margin-top:8px">437 páginas · notas a mano</div></div></div>`);
const btnOn = add(scr, `<div class="abs" style="left:205px;top:1069px;width:779px;height:100px;border-radius:30px;background:#14b8a6;color:#fff;font-size:40px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 34px rgba(20,184,166,.45)">Analizar y Extraer Datos</div>`);
const anal = add(scr, `<div class="abs" style="left:212px;top:648px;width:765px;height:381px;border-radius:52px;background:#fff;border:3px solid #ccfbf1;padding:40px 46px">
  <div style="font-size:36px;font-weight:800;color:#0f172a">Extrayendo datos… <span id="apct" style="color:#14b8a6"></span></div>
  <div style="margin-top:20px;height:20px;border-radius:10px;background:#e2e8f0;overflow:hidden"><div id="abar" style="height:100%;width:0;background:linear-gradient(90deg,#14b8a6,#8b5cf6)"></div></div>
  <div id="checks" style="margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;font-size:30px;font-weight:600;color:#0f766e">
  ${['Datos generales', 'Antecedentes', 'Exploración física', 'Diagnóstico'].map(s => `<div>✓ ${s}</div>`).join('')}</div></div>`);
const scan = add(scr, '<div class="abs" style="left:212px;width:765px;height:8px;background:linear-gradient(90deg,transparent,#5eead4,transparent);box-shadow:0 0 30px #5eead4"></div>');
const imExp = add(scr, '<img src="assets/fernando/expediente.jpg">');
// campos que se escriben en el expediente
const fName = add(scr, '<div class="abs" style="left:345px;top:700px;width:740px;height:92px;background:#fff;font-size:69px;font-weight:900;letter-spacing:-2px;color:#0f172a;white-space:pre;line-height:92px"></div>');
const fDx = add(scr, '<div class="abs" style="left:345px;top:786px;width:600px;height:48px;background:#fff;font-size:36px;font-weight:700;color:#0b6fb8;white-space:pre;line-height:48px"></div>');
const fTer = add(scr, '<div class="abs" style="left:245px;top:936px;width:700px;height:48px;background:#f9fafe;font-size:34px;font-weight:600;color:#0f172a;white-space:pre;line-height:48px"></div>');
const fId = add(scr, '<div class="abs" style="left:156px;top:510px;width:372px;height:76px;border-radius:38px;background:#fff"></div>');
const ripple = add(S4, '<div id="ripple"></div>');
const finger = add(S4, '<div id="finger"></div>');

let cam = { z: 1, fx: 594, fy: 1288 };
function camAt(t, keys) {
  if (t <= keys[0][0]) return { z: keys[0][1], fx: keys[0][2], fy: keys[0][3] };
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (t <= b[0]) { const e = eio(prog(t, a[0], b[0])); return { z: lerp(a[1], b[1], e), fx: lerp(a[2], b[2], e), fy: lerp(a[3], b[3], e) }; }
  }
  const k = keys[keys.length - 1]; return { z: k[1], fx: k[2], fy: k[3] };
}
const toVideo = (x, y, dy) => { const sc = S * cam.z; return [CX - cam.fx * sc + x * sc, CY - cam.fy * sc + y * sc + dy]; };
function drawFinger(t, taps, tIn, tOut, dy) {
  const v = prog(t, tIn, tIn + .3) * (1 - prog(t, tOut, tOut + .3));
  let x, y;
  const i = taps.findIndex(p => t < p.t - .5);
  if (i === 0) { [x, y] = toVideo(taps[0].x, taps[0].y, dy); const k = 1 - eout(prog(t, tIn, taps[0].t - .5)); x += 160 * k; y += 260 * k; }
  else if (i === -1) [x, y] = toVideo(taps.at(-1).x, taps.at(-1).y, dy);
  else { const a = taps[i - 1], b = taps[i], k = eio(prog(t, a.t + .15, b.t - .5)); [x, y] = toVideo(lerp(a.x, b.x, k), lerp(a.y, b.y, k), dy); }
  let press = 0, rip = -1;
  taps.forEach(p => { press = Math.max(press, 1 - Math.abs(t - p.t) / .14); if (t >= p.t && t < p.t + .55) rip = (t - p.t) / .55; });
  finger.style.left = ripple.style.left = x + 'px'; finger.style.top = ripple.style.top = y + 'px';
  finger.style.opacity = v; finger.style.transform = `scale(${1 - .22 * clamp(press)})`;
  ripple.style.opacity = rip < 0 ? 0 : (1 - rip) * v; ripple.style.transform = `scale(${1 + 1.6 * eout(Math.max(rip, 0))})`;
}

/* ---------- Cierre (escena 6) ---------- */
const S6 = add(V, `<div class="scene">
  <div class="abs" id="ol" style="left:390px;top:540px;width:300px;height:300px;border-radius:50%;overflow:hidden;box-shadow:0 0 110px 20px rgba(139,92,246,.55);-webkit-mask-image:radial-gradient(circle,#000 97%,transparent 100%)">
    <img src="assets/logo_master.jpg" style="position:absolute;left:-41.4px;top:-39.9px;width:384px;height:384px"></div>
  <div class="abs" id="ot" style="left:0;width:1080px;top:900px;text-align:center;color:#fff;font-size:108px;font-weight:900;letter-spacing:6px">PHYSIOVERSE</div>
  <div class="abs" id="os" style="left:60px;right:60px;top:1040px;text-align:center;color:#4fd1b5;font-size:36px;font-weight:500">Plataforma Integral de Fisioterapia & Rehabilitación</div>
  <div class="abs" id="oc" style="left:240px;top:1210px;width:600px;height:120px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:800;color:#0b1120;background:linear-gradient(90deg,#5eead4,#a78bfa);box-shadow:0 20px 60px rgba(94,234,212,.35)">Solicita tu demo →</div></div>`);

/* ---------- Textos ---------- */
add(V, '<div id="captionShade"></div>');
const CAPS = [
  { h: 'Fernando lleva 15 años como fisioterapeuta…', p: '', t0: .3, t1: 4.1 },
  { h: '…y cientos de expedientes hechos a mano.', p: '', t0: 4.3, t1: 8.4 },
  { h: 'Intentó pasarlos a digital…', p: '', t0: 8.9, t1: 12.2 },
  { h: '…pero parecía imposible.', p: 'Horas de captura, archivos que no se leen', t0: 12.4, t1: 16.0 },
  { h: 'Hasta que descubrió Physioverse.', p: '', t0: 16.5, t1: 18.6 },
  { h: 'Importa tus expedientes en un clic', p: 'PDF, Word, notas o fotos de tus hojas', t0: 18.8, t1: 25.4 },
  { h: 'Physioverse arma el expediente completo', p: 'Interactivo, ordenado y fácil de usar', t0: 25.6, t1: 28.4 },
  { h: 'Fernando ya no pierde ni un expediente.', p: '¿Y tú, cuándo das el salto?', t0: 28.8, t1: 33.2 }
].map(c => ({ ...c, node: add(V, `<div class="cap"><h1>${c.h.split(' ').map(w => `<span>${w}</span>`).join(' ')}</h1>${c.p ? `<p>${c.p}</p>` : ''}</div>`) }));
function drawCaps(t) {
  CAPS.forEach(c => {
    const out = prog(t, c.t1 - .3, c.t1);
    c.node.style.opacity = t < c.t0 ? 0 : 1 - out;
    c.node.style.transform = `translateY(${-24 * eio(out)}px)`;
    [...c.node.querySelectorAll('h1 span')].forEach((s, i) => {
      const k = eout(prog(t, c.t0 + i * .06, c.t0 + i * .06 + .4));
      s.style.opacity = k; s.style.transform = `translateY(${(1 - k) * 44}px)`;
    });
    const p = c.node.querySelector('p'); if (p) p.style.opacity = eout(prog(t, c.t0 + .4, c.t0 + .8));
  });
}
const fade = add(V, '<div class="abs" style="inset:0;background:#0b1120;z-index:99"></div>');

const DUR = 37;
window.DUR = DUR;
window.render = function (t) {
  drawBg(t);
  // Escena 1
  C1.sc.style.opacity = vis(t, 0, 8.75, .01, .3);
  if (t < 8.8) {
    drawClip(C1, t);
    const kb = eback(prog(t, .9, 1.3)) * (1 - prog(t, 3.6, 3.9));
    bubble.style.opacity = clamp(kb * 1.3); bubble.style.transform = `scale(${lerp(.6, 1, clamp(kb))})`;
  }
  // Escena 2
  C2.sc.style.opacity = vis(t, 8.45, 16.3, .3, .2);
  if (t > 8.4 && t < 16.4) {
    drawClip(C2, t, .09);
    const pv = vis(t, 9.4, 16.3, .3, .2);
    prog1.style.opacity = pv; prog1.style.transform = `translateY(${(1 - eout(prog(t, 9.4, 9.8))) * 60}px)`;
    const p = 12 * eout(prog(t, 9.6, 10.6));
    document.getElementById('pbar').style.width = p + '%';
    document.getElementById('ptext').textContent = Math.floor(p) + ' %' + (t > 11 ? ' · sin respuesta' : '');
    ERRS.forEach(e => {
      const k = eback(prog(t, e.t, e.t + .3));
      e.n.style.opacity = clamp(k * 1.5) * (1 - prog(t, 16.0, 16.3));
      const shake = t > e.t + .3 && t < e.t + .7 ? Math.sin((t - e.t) * 80) * 10 * (1 - prog(t, e.t + .3, e.t + .7)) : 0;
      e.n.style.transform = `translateX(${shake}px) scale(${lerp(.6, 1, clamp(k))})`;
    });
  }
  // Escena 3: galaxia
  S3.style.opacity = vis(t, 16.1, 18.7, .2, .3);
  if (t > 16 && t < 18.8) {
    const k = eback(prog(t, 16.2, 17.2));
    const gx = document.getElementById('gx');
    gx.style.transform = `scale(${lerp(.1, 1, clamp(k, 0, 1.2))}) rotate(${-360 * (1 - eout(prog(t, 16.2, 17.6))) + 15 * t}deg)`;
    document.getElementById('flash').style.opacity = clamp(1 - Math.abs(t - 18.3) / .35) + .35 * clamp(1 - Math.abs(t - 17.1) / .3);
  }
  // Escena 4: teléfono
  S4.style.opacity = vis(t, 18.4, 28.7, .3, .3);
  if (t > 18.3 && t < 28.8) {
    const enter = eout(prog(t, 18.4, 19.2)), dy = (1 - enter) * 700;
    cam = camAt(t, [[18.4, 1, 594, 1288], [19.6, 1, 594, 1288], [20.4, 1.45, 500, 1150], [21.3, 1.45, 500, 1150], [21.9, 1.45, 594, 880],
                    [25.5, 1.45, 594, 880], [26.1, 1.45, 594, 820], [28.6, 1.5, 594, 820]]);
    const sc = S * cam.z;
    pw.style.transform = `translate(${CX - cam.fx * sc}px,${CY - cam.fy * sc + dy}px) scale(${sc})`;
    rowHi.style.opacity = prog(t, 20.6, 20.8) * (t < 21.6 ? 1 : 0);
    imImp.style.opacity = prog(t, 21.2, 21.6);
    const fk = eout(prog(t, 22.0, 22.6));
    zone.style.opacity = prog(t, 22.3, 22.6) * (1 - prog(t, 23.4, 23.6));
    fileCard.style.opacity = prog(t, 21.9, 22.1) * (1 - prog(t, 23.4, 23.6));
    fileCard.style.transform = `translate(${(1 - fk) * 300}px,${(1 - fk) * 1500}px) rotate(${(1 - fk) * 20}deg) scale(${lerp(.8, 1, fk)})`;
    btnOn.style.opacity = prog(t, 22.7, 22.9);
    btnOn.style.transform = `scale(${1 - .05 * clamp(1 - Math.abs(t - 23.2) / .15)})`;
    anal.style.opacity = prog(t, 23.4, 23.6) * (1 - prog(t, 25.6, 25.9));
    const ap = eio(prog(t, 23.6, 25.2));
    document.getElementById('abar').style.width = ap * 100 + '%';
    document.getElementById('apct').textContent = Math.round(ap * 100) + '%';
    [...document.getElementById('checks').children].forEach((c, i) => c.style.opacity = prog(t, 23.8 + i * .35, 24.0 + i * .35));
    scan.style.opacity = t > 23.5 && t < 25.3 ? .9 : 0;
    scan.style.top = 655 + 365 * (.5 - .5 * Math.cos((t - 23.5) * 5)) + 'px';
    imExp.style.opacity = prog(t, 25.6, 26.0);
    const n = 'Prueba Paciente 10', d = 'Neuropatía periférica aguda', te = 'Fisio Orden 90 (Fisioterapeuta Staff)';
    fName.textContent = typed(n, t, 26.0, 22); fDx.textContent = typed(d, t, 26.7, 34); fTer.textContent = typed(te, t, 27.3, 40);
    const ex = prog(t, 25.6, 26.0);
    [fName, fDx, fTer].forEach(f => f.style.opacity = ex);
    fId.style.opacity = ex * (1 - prog(t, 27.9, 28.2));
    drawFinger(t, [{ t: 19.5, x: 402, y: 910 }, { t: 20.9, x: 464, y: 1227 }, { t: 23.2, x: 594, y: 1119 }], 18.9, 23.6, dy);
  }
  // Escena 5
  C3.sc.style.opacity = vis(t, 28.55, 33.5, .3, .3);
  if (t > 28.5 && t < 33.6) drawClip(C3, t, .05);
  // Escena 6
  S6.style.opacity = vis(t, 33.4, 40, .4, .1);
  if (t > 33.3) {
    const k = eback(prog(t, 33.5, 34.2));
    document.getElementById('ol').style.transform = `scale(${lerp(.4, 1, k)}) rotate(${t * 30}deg)`;
    const kt = eout(prog(t, 33.8, 34.4));
    document.getElementById('ot').style.opacity = kt; document.getElementById('ot').style.transform = `translateY(${(1 - kt) * 50}px)`;
    document.getElementById('os').style.opacity = prog(t, 34.2, 34.7);
    const kc = eback(prog(t, 34.7, 35.2));
    const oc = document.getElementById('oc');
    oc.style.opacity = clamp(kc); oc.style.transform = `scale(${lerp(.6, 1, kc) * (1 + .035 * Math.sin(Math.max(0, t - 35.2) * 6))})`;
  }
  drawCaps(t);
  fade.style.opacity = Math.max(1 - prog(t, 0, .3), prog(t, DUR - .5, DUR));
};
window.render(0);
if (new URLSearchParams(location.search).has('play')) {
  const t0 = performance.now();
  (function loop() { window.render(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); })();
}
</script>
