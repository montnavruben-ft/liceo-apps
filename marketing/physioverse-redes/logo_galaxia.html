<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Physioverse · Logo galaxia</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #05070f; font-family: 'Inter', sans-serif; }
  #video { position: relative; width: 1080px; height: 1920px; overflow: hidden;
           background: radial-gradient(circle at 50% 45%, #141c40 0%, #070a18 55%, #04050c 100%); }
  .abs { position: absolute; }
  canvas { position: absolute; left: 0; top: 0; }
  #cam { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  #disc { position: absolute; left: -410px; top: -410px; width: 820px; height: 820px; border-radius: 50%; overflow: hidden;
          -webkit-mask-image: radial-gradient(circle, #000 97.5%, transparent 100%); }
  #disc img { position: absolute; left: -113.2px; top: -109.1px; width: 1049.5px; height: 1049.5px; }
  #swirl { position: absolute; inset: 0; border-radius: 50%; mix-blend-mode: screen;
           background: conic-gradient(from 0deg, transparent 0 20%, rgba(94,234,212,.16) 30%, transparent 42% 70%, rgba(217,70,239,.16) 80%, transparent 92%); }
  #halo { position: absolute; left: -405px; top: -405px; width: 810px; height: 810px; border-radius: 50%;
          box-shadow: 0 0 140px 30px rgba(139,92,246,.55), 0 0 70px 10px rgba(34,211,238,.45); }
  #spot { position: absolute; left: 540px; top: 860px; width: 900px; height: 900px; margin: -450px; border-radius: 50%; mix-blend-mode: screen;
          background: radial-gradient(circle, rgba(165,243,252,.35) 0%, rgba(139,92,246,.12) 35%, transparent 65%); }
  #streak { position: absolute; left: -100px; width: 1280px; top: 857px; height: 6px; border-radius: 3px; mix-blend-mode: screen;
            background: linear-gradient(90deg, transparent, rgba(165,243,252,.9) 40%, #fff 50%, rgba(240,171,252,.9) 60%, transparent); filter: blur(2px); }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 540px 860px, transparent 0 420px, rgba(3,5,14,.75) 900px); }
  #brand { position: absolute; left: 0; width: 1080px; top: 1180px; text-align: center; }
</style>
</head>
<body>
<div id="video">
  <canvas id="stars" width="1080" height="1920"></canvas>
  <div id="cam"><div id="halo"></div><div id="disc"><img src="assets/logo_master.jpg"><div id="swirl"></div></div></div>
  <div id="spot"></div>
  <div id="streak"></div>
  <div id="vignette"></div>
  <div id="brand">
    <div id="bt" style="color:#fff;font-size:116px;font-weight:900;letter-spacing:7px"></div>
    <div id="bs" style="color:#4fd1b5;font-size:37px;font-weight:500;margin-top:22px">Plataforma Integral de Fisioterapia & Rehabilitación</div>
    <div id="bl" style="color:#fff;font-size:48px;font-weight:800;margin-top:90px">Todo tu universo clínico,<br><span style="color:#5eead4">en un solo lugar.</span></div>
  </div>
  <div id="fade" class="abs" style="inset:0;background:#04050c"></div>
</div>
<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, t0, t1) => clamp((t - t0) / (t1 - t0));
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eout = k => 1 - Math.pow(1 - k, 3);
const eback = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const $ = id => document.getElementById(id);
const R = 410;                  // radio del disco en px de video (zoom 1)
const C = [540, 860];

/* Partes del logo a recorrer (unidades del radio del disco, centro = 0,0) */
const SHOTS = [
  [0.01, -0.72],   // neurona superior
  [0.52, -0.16],   // columna derecha
  [0.08, 0.47],    // pesas inferiores
  [-0.77, -0.04],  // hueso / articulación izquierda
  [-0.46, -0.44],  // neurona izquierda
];
const T0 = 3.6, STEP = 2.2, TRAVEL = .95, ZIN = 3.3, ZPUSH = 3.55;
const TEND = T0 + SHOTS.length * STEP;       // inicio del alejamiento final
const TOUT = TEND + 1.3;

$('bt').innerHTML = 'PHYSIOVERSE'.split('').map(c => `<span style="display:inline-block">${c}</span>`).join('');

/* Estrellas deterministas */
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const COLS = ['#a5f3fc', '#c4b5fd', '#f0abfc', '#ffffff', '#5eead4'];
const STARS = Array.from({ length: 900 }, (_, i) => {
  const arm = i % 3 !== 0, r = 60 + Math.pow(rnd(), .7) * 1050;
  const a0 = arm ? (i % 2) * Math.PI + 1.9 * Math.log(r / 60) + (rnd() - .5) * .5 : rnd() * Math.PI * 2;
  return { r, a0, s: .6 + rnd() * 2.6, c: COLS[Math.floor(rnd() * COLS.length)], tw: rnd() * 6.28, sp: .5 + rnd() };
});
const ctx = $('stars').getContext('2d');
function drawStars(t, spin, cy) {
  ctx.clearRect(0, 0, 1080, 1920);
  const inK = eout(prog(t, 0, 2.6));
  for (const s of STARS) {
    const r = s.r * lerp(2.6, 1, inK);
    const a = s.a0 + spin * (260 / (s.r + 160)) * s.sp;
    const x = C[0] + Math.cos(a) * r, y = cy + Math.sin(a) * r * .92;
    if (x < -10 || x > 1090 || y < -10 || y > 1930) continue;
    ctx.globalAlpha = (.35 + .65 * (.5 + .5 * Math.sin(t * 3 * s.sp + s.tw))) * clamp(inK * 1.5);
    ctx.fillStyle = s.c; ctx.beginPath(); ctx.arc(x, y, s.s, 0, 6.283); ctx.fill();
    if (t < 2.6) {
      ctx.globalAlpha *= .35; ctx.strokeStyle = s.c; ctx.lineWidth = s.s;
      ctx.beginPath(); ctx.arc(C[0], cy, r, a - .35 * (1 - inK), a); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

/* Cámara: [z, fx, fy] en cada instante. Entre tomas hace un "swoop": se aleja un poco a mitad del viaje. */
function camAt(t) {
  if (t < T0) return [1, 0, 0];
  if (t >= TEND) {
    const last = SHOTS[SHOTS.length - 1], e = eio(prog(t, TEND, TOUT));
    return [lerp(ZPUSH, .62, e), lerp(last[0], 0, e), lerp(last[1], 0, e)];
  }
  const i = Math.floor((t - T0) / STEP), ts = T0 + i * STEP;
  const from = i === 0 ? [1, 0, 0] : [ZPUSH, ...SHOTS[i - 1]];
  const to = SHOTS[i];
  if (t < ts + TRAVEL) {
    const k = prog(t, ts, ts + TRAVEL), e = eio(k);
    const dip = i === 0 ? 0 : 1.0 * Math.sin(Math.PI * k);
    return [lerp(from[0], ZIN, e) - dip, lerp(from[1], to[0], e), lerp(from[2], to[1], e)];
  }
  return [lerp(ZIN, ZPUSH, prog(t, ts + TRAVEL, ts + STEP)), to[0], to[1]];
}
function thetaAt(t) {   // grados
  let th = -620 * (1 - eout(prog(t, 0, 2.8))) + 7 * t;
  SHOTS.forEach((_, i) => th += 38 * eio(prog(t, T0 + i * STEP, T0 + i * STEP + TRAVEL)));
  th += 110 * eio(prog(t, TEND, TOUT + .2));
  return th;
}
function screenOfCenter(t) {   // posición en pantalla del centro del disco (para medir velocidad)
  const [z, fx, fy] = camAt(t), th = thetaAt(t) * Math.PI / 180;
  const vx = -fx * R * z, vy = -fy * R * z;
  return [vx * Math.cos(th) - vy * Math.sin(th), vx * Math.sin(th) + vy * Math.cos(th), z];
}

const DUR = 19.2;
window.DUR = DUR;
window.render = function (t) {
  const th = thetaAt(t);
  const cy = C[1] - 170 * eio(prog(t, TEND + .2, TOUT + .2));
  drawStars(t, th * Math.PI / 180 * .9, cy);

  const [z0, fx, fy] = camAt(t);
  const z = z0 * lerp(.12, 1, eback(prog(t, .2, 2.6)));
  $('cam').style.transform = `translate(${C[0]}px,${cy}px) scale(${z}) rotate(${th}deg) translate(${-fx * R}px,${-fy * R}px)`;
  $('cam').style.opacity = prog(t, .2, .9);

  // Desenfoque de movimiento según la velocidad de la cámara
  const a = screenOfCenter(t - 1 / 60), b = screenOfCenter(t + 1 / 60);
  const speed = Math.hypot(b[0] - a[0], b[1] - a[1]) + Math.abs(b[2] - a[2]) * 400;
  const blur = t > T0 ? clamp((speed - 6) / 10, 0, 1) * 5 : 0;
  const flash = clamp(1 - Math.abs(t - 2.5) / .5);
  $('disc').style.filter = `brightness(${1 + .5 * flash}) saturate(1.12) blur(${blur.toFixed(2)}px)`;
  $('swirl').style.transform = `rotate(${t * 60}deg)`;
  $('swirl').style.opacity = .55 + .35 * Math.sin(t * 2);
  $('halo').style.opacity = .7 + .3 * flash;

  // Llegada a cada toma: destello suave + estela anamórfica
  let arrive = 0;
  SHOTS.forEach((_, i) => { const ta = T0 + i * STEP + TRAVEL; arrive = Math.max(arrive, clamp(1 - Math.abs(t - ta) / .35)); });
  arrive = eio(arrive);
  const close = clamp((z0 - 1) / (ZIN - 1));
  $('spot').style.opacity = (.25 + .55 * arrive) * close;
  $('spot').style.transform = `scale(${1 + .15 * arrive})`;
  $('streak').style.opacity = .85 * arrive * close;
  $('streak').style.transform = `scaleX(${.4 + .6 * arrive})`;
  $('vignette').style.opacity = .4 + .6 * close;

  // Encuadre final con la marca
  [...$('bt').children].forEach((s, i) => {
    const q = eback(prog(t, TOUT - .4 + i * .05, TOUT + .1 + i * .05));
    s.style.opacity = prog(t, TOUT - .4 + i * .05, TOUT - .1 + i * .05); s.style.transform = `translateY(${(1 - q) * 70}px)`;
  });
  $('bs').style.opacity = prog(t, TOUT + .3, TOUT + .8);
  const kl = eout(prog(t, TOUT + .8, TOUT + 1.4));
  $('bl').style.opacity = kl; $('bl').style.transform = `translateY(${(1 - kl) * 40}px)`;

  $('fade').style.opacity = Math.max(1 - prog(t, 0, .3), prog(t, DUR - .5, DUR));
};
window.render(0);
if (new URLSearchParams(location.search).has('play')) {
  const t0 = performance.now();
  (function loop() { window.render(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); })();
}
</script>
</body>
</html>
